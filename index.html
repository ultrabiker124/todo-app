<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Today — a focused task list</title>
  <style>
    :root{color-scheme:light dark;font-family:"Avenir Next","Segoe UI",ui-sans-serif,system-ui,sans-serif;--bg:#f5f7fb;--card:#fff;--soft:#f0f3f8;--text:#172033;--muted:#6f7a8e;--line:#e1e6ef;--accent:#5b5ce2;--danger:#c84c5a}
    @media(prefers-color-scheme:dark){:root{--bg:#111522;--card:#1b2130;--soft:#252d3d;--text:#f4f6fb;--muted:#a4aec1;--line:#30394c;--accent:#8788ff;--danger:#ff8b97}}
    *{box-sizing:border-box}body{min-width:280px;min-height:100vh;margin:0;padding:32px 18px;color:var(--text);background:radial-gradient(circle at 50% -10%,#5b5ce21f,transparent 42%),var(--bg);font-size:15px;line-height:1.5}
    main{width:min(100%,480px);margin:auto}.shell{padding:clamp(24px,6vw,38px);background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 60px #1e28461a,0 4px 14px #1e28460d}
    .eyebrow{margin:0 0 7px;color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-family:"Trebuchet MS","Avenir Next",sans-serif;font-size:clamp(30px,8vw,40px);line-height:1.08;letter-spacing:-.04em}.intro{margin:10px 0 26px;color:var(--muted)}
    form{display:flex;gap:10px;margin-bottom:22px}.input{min-width:0;flex:1;padding:13px 15px;color:var(--text);background:var(--soft);border:1px solid transparent;border-radius:12px;outline:0;font:inherit}.input:focus{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 4px #5b5ce22e}.add{padding:0 17px;color:#fff;background:var(--accent);border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}.add:hover{filter:brightness(1.08)}
    .heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.heading h2{margin:0;font-size:14px}.count{color:var(--muted);font-size:13px}.tasks{display:grid;gap:9px;padding:0;margin:0;list-style:none}.task{display:flex;align-items:center;gap:12px;min-height:59px;padding:10px 11px 10px 13px;background:var(--card);border:1px solid var(--line);border-radius:14px;animation:enter .3s ease both}.task.done{background:var(--soft)}.check{display:grid;flex:0 0 auto;place-items:center;width:22px;height:22px;margin:0;appearance:none;border:1.5px solid var(--muted);border-radius:7px;cursor:pointer;transition:.22s}.check:checked{background:var(--accent);border-color:var(--accent);transform:scale(1.05)}.check:after{width:9px;height:5px;content:"";border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) scale(0);transition:.2s}.check:checked:after{transform:rotate(-45deg) scale(1)}.label{flex:1;min-width:0;overflow-wrap:anywhere}.done .label{color:var(--muted);text-decoration:line-through}.delete{flex:0 0 auto;width:30px;height:30px;padding:0;color:var(--muted);background:transparent;border:0;border-radius:8px;font-size:20px;cursor:pointer}.delete:hover{color:var(--danger);background:#c84c5a1f}.empty{padding:26px 12px 16px;color:var(--muted);text-align:center}.note{margin:22px 0 0;color:var(--muted);font-size:12px;text-align:center}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:420px){body{padding:18px 12px}.shell{padding:24px 18px;border-radius:20px}form{flex-direction:column}.add{min-height:46px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body><main><section class="shell" aria-labelledby="title">
  <p class="eyebrow">Daily focus</p><h1 id="title">My tasks</h1><p class="intro">A small list for the things that matter today.</p>
  <form id="form"><label class="sr-only" for="input">New task</label><input class="input" id="input" maxlength="120" placeholder="What needs doing?" autocomplete="off" required><button class="add">Add task</button></form>
  <div class="heading"><h2>Your list</h2><span class="count" id="count" aria-live="polite"></span></div>
  <ul class="tasks" id="tasks" aria-label="Tasks"></ul><p class="empty" id="empty" hidden>Nothing here yet. Add a task to get started.</p><p class="note">Saved automatically on this device</p>
</section></main>
<script>
(()=>{const key="today-tasks-v1",starter=["Plan the day in three priorities","Take a proper screen break","Write down one thing that went well"].map(text=>({id:crypto.randomUUID(),text,done:false}));let tasks=read();const form=document.querySelector("#form"),input=document.querySelector("#input"),list=document.querySelector("#tasks"),count=document.querySelector("#count"),empty=document.querySelector("#empty");
function read(){try{const value=JSON.parse(localStorage.getItem(key));return Array.isArray(value)?value.filter(t=>t&&typeof t.id==="string"&&typeof t.text==="string"&&typeof t.done==="boolean"):starter}catch{return starter}}function save(){localStorage.setItem(key,JSON.stringify(tasks))}
function render(){list.replaceChildren();tasks.forEach((task,i)=>{const li=document.createElement("li");li.className="task"+(task.done?" done":"");li.style.animationDelay=Math.min(i*35,180)+"ms";const cb=document.createElement("input");cb.className="check";cb.type="checkbox";cb.checked=task.done;cb.ariaLabel=`Mark "${task.text}" as complete`;cb.onchange=()=>{task.done=cb.checked;save();render()};const label=document.createElement("span");label.className="label";label.textContent=task.text;const del=document.createElement("button");del.className="delete";del.type="button";del.textContent="×";del.ariaLabel=`Delete "${task.text}"`;del.onclick=()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render()};li.append(cb,label,del);list.append(li)});const left=tasks.filter(t=>!t.done).length;count.textContent=`${left} ${left===1?"task":"tasks"} left`;empty.hidden=tasks.length>0}
form.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;tasks.unshift({id:crypto.randomUUID(),text,done:false});save();render();form.reset();input.focus()};render()})()
</script></body></html>
